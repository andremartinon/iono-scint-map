[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "iono_scint_map"
dynamic = ["version"]
dependencies = [
    "cartopy~=0.25.0",
    "click~=8.3.1",
    "h5py~=3.15.1",
    "matplotlib~=3.10.8",
    "numba~=0.63.1",
    "numpy~=2.3.5",
    "polars~=1.37.1",
    "ppigrf~=2.1.0",
    "scikit-learn~=1.8.0",
    "rich~=14.3",
    "opencv-python~=4.13",
    "shapely~=2.1",
    "shapelysmooth~=0.2"
]
requires-python = ">=3.12"
authors = [
    {name = "André Ricardo Fazanaro Martinon", email = "andre.martinon@inpe.br"},
    {name = "Stephan Stephany", email = "stephan.stephany@inpe.br"},
    {name = "Eurico Rodrigues de Paula", email = "eurico.paula@inpe.br"},
]
maintainers = [
    {name = "André Ricardo Fazanaro Martinon", email = "andre.martinon@inpe.br"}
]
description = "An ionospheric scintillation map generation toolkit"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["Ionospheric scintillation map",
            "Interpolation",
            "Gaussian process regression",
            "GNSS data"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "build~=1.4.0",
    "pytest~=9.0.2"
]

[project.scripts]
iono-scint-map = "iono_scint_map.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "iono_scint_map.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
